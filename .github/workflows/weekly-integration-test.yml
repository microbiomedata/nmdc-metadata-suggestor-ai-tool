name: Weekly VertexAI Integration Test

on:
  schedule:
    - cron: "0 17 * * 1"  # Monday 5pm UTC = 9am PT
  workflow_dispatch:       # Manual trigger for testing

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run VertexAI integration tests
        env:
          NMDC_HTTP_RETRY_ATTEMPTS: "1"
          NMDC_HTTP_MAX_RETRY_DELAY_SECONDS: "5"
        run: uv run pytest tests/test_vertexai_integration.py -m integration -v
