name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    # Audits the full locked dependency tree for known CVEs (pip-audit).
    # Runs on every push and PR, since CI (ci.yml) does linting/types/tests
    # but no security scanning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync

    # Report-only for now: main carries pre-existing CVEs, so a hard failure
    # would red every build until the backlog is cleared. Dependabot security
    # updates (.github/dependabot.yml) drive the actual fixes. Once the backlog
    # is clear, remove continue-on-error to make this a blocking gate.
    - name: Audit dependencies for known CVEs (pip-audit)
      continue-on-error: true
      run: make security

  dependency-review:
    # Flags dependency changes that INTRODUCE known-vulnerable packages,
    # comparing the PR head against its base (the scenario behind issue #101,
    # where the agentic branch added CVEs via the claude-agent-sdk/mcp stack).
    # PR-only: the action requires a base and head to diff.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # issues: write is needed by comment-summary-in-pr, which posts the
      # vulnerability summary as a PR comment (a PR comment uses the issues API).
      issues: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    # Non-blocking until the Dependency graph is enabled for the repo
    # (Settings > Code security > Dependency graph). Without it the action
    # errors with "Dependency review is not supported on this repository".
    # Once the graph is on, remove continue-on-error to make this a real gate.
    - name: Dependency review
      continue-on-error: true
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high
        comment-summary-in-pr: on-failure
