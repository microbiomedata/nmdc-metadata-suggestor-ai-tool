# Hand-written for illustration, not mapper agent output. Real rows: the first six of
# tests/fixtures/PRJEB13831_Phage_metadata.csv, a wastewater surveillance sheet in a
# GenEpio-style template with 232 columns, only 21 of which hold any values. Only the
# populated columns are mapped here; the rest are left out of the spec.
description: Wastewater metagenome surveillance sheet, PRJEB13831 (first 6 rows)
mixs_extensions: [water]
created: 2026-10-06
mappings:
  - source_column: specimen_collector_sample_id
    mixs_extension: Water
    nmdc_candidate_slots: [samp_name]
    confidence: high
    reason: The collector's sample ID; some values carry a trailing space
    conversion:
      type: custom
      description: trim whitespace
      expression: value.strip()
  - source_column: sample_collection_start_date
    mixs_extension: Water
    nmdc_candidate_slots: [collection_date]
    confidence: high
    reason: US month/day/year; no end date is given, so the start date stands
    conversion:
      type: date_format
      description: M/D/YYYY → ISO 8601
      expression: "%m/%d/%Y"
  - source_column: geo_loc_name_country
    combine_columns: [geo_loc_name_state_province_territory]
    mixs_extension: Water
    nmdc_candidate_slots: [geo_loc_name]
    confidence: high
    reason: "Country and region in two columns; NMDC wants 'country: region'"
    conversion:
      type: custom
      description: "join as 'country: region'"
      expression: "values['geo_loc_name_country'].strip() + ': ' + values['geo_loc_name_state_province_territory'].strip()"
  - source_column: biosample_accession
    mixs_extension: Water
    nmdc_candidate_slots: [source_mat_id]
    confidence: review
    reason: An INSDC BioSample accession; source_mat_id is the nearest submission slot, but NMDC may prefer to record it as an external identifier
  - source_column: organism
    confidence: cant_place
    reason: NCBI metagenome taxon name; not a submission schema slot
  - source_column: sequencing_instrument
    confidence: cant_place
    reason: Sequencing metadata belongs on the data generation record, not the biosample
