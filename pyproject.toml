[project]
name = "nmdc-metadata-suggestor"
version = "0.1.0"
description = "NMDC Submission portal metadata suggestor tool, powered by AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "google-auth>=2.0.0",
    "requests>=2.31.0",
    "google-genai>=1.62.0",
    "linkml-runtime>=1.7.0",
    "nmdc-submission-schema>=11.0.0",
    "openai>=2.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "responses>=0.25.0",
    "types-requests>=2.31.0",
]

[project.scripts]
nmdc-suggestor = "nmdc_metadata_suggestor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmdc_metadata_suggestor"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: hits real external APIs (deselect with -m 'not integration')",
]
addopts = "-m 'not integration'"
